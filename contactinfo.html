<!DOCTYPE html>
<html>
    <head>
        <link rel=stylesheet href=./styles.css>
        <title>Contact Info</title>
    </head>
    <nav>
        <ul class = "navbar">
            <li id="nav"><a href="index.html">Home</a></li>
            <li id="nav"><a href="intrests.html">Interests</a></li>
            <li id="nav"><a href="news.html">News</a></li>
            <li id="nav"><a href="contactinfo.html">Contact Info</a></li>
        </ul>
    </nav>
    <body>
        <header>
            <h1>Contact Info</h1>
        </header>
        <main>
            <div class="flex-container">
                <div>
                    <p>Email: maddy.puryear@outlook.com</p>
                    <p>Socials:</p>
                    <a id="linkedin" href="https://www.linkedin.com/in/madeline-puryear-98b373284">Linked In</a>
                </div>
                <div>
                    <form>
                        <h1>Contact Me</h1>
                        <section class="Name">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required>
                        </section>

                        <section class="Mail">
                            <label for="email">Email:</label>
                            <input type="text" id="email" name="email" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"><!--Had to look up-->
                        </section>

                        <section class="Phone">
                            <label for="phone">Phone:</label>
                            <input type="text" id="phone" name="phone" pattern="[0-9]{10}">
                        </section>

                        <section class="Type">
                            <h3>Feedback</h3>
                            <label for="question">Question</label>
                            <input type="radio" id="question" name="feedback" value="quest">
                            <label for="comment">Comment</label>
                            <input type="radio" id="comment" name="feedback" value="comment">
                            <label for="suggestion">Suggestion</label>
                            <input type="radio" id="suggestion" name="feedback" value="suggest">
                        </section>
                        <br>
                        <section class="Feedbck">
                            <label for="fb">Type here</label>
                            <br>
                            <textarea id="fb" name="fb" rows="3" cols="28" minlength="10">Let me know ur thoughts! :3</textarea>
                        </section>

                        <input id="subbutt"type="submit" value="send">
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
